# Example nginx site for the static build. Copy to /etc/nginx/sites-available/sudoku,
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
#
# Behind Cloudflare: SSL mode "Flexible" works with this port-80 block as-is.
# For "Full (strict)" add a listen 443 ssl block with an origin cert (see your other sites).
server {
    listen 80;
    listen [::]:80;
    server_name sudoku.example.com;

    root /opt/sudoku;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Must always be revalidated so new deploys are picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html + everything else; unknown paths fall back to the app.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
